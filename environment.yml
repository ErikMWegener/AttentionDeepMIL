# Conda environment for the code of the thesis (tested on Linux x86-64).
#   conda env create -f environment.yml && conda activate attentiondeepmil
# Without an NVIDIA GPU, remove the pytorch-cuda line (PyTorch then runs on the CPU).
#
# Packages that determine the results are pinned to the versions used for the
# experiments. The others are left open because the exact combination of the
# original environment can no longer be solved; the versions used were
# h5py 3.15.1, pillow 12.1.1, pyyaml 6.0.3, tqdm 4.67.3, umap-learn 0.5.4, pytest 9.0.2.
name: attentiondeepmil
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.10.14
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - scipy=1.11.4
  - scikit-learn=1.6.1
  - pandas=2.0.3
  - h5py
  - pillow
  - pyyaml
  - tqdm
  - umap-learn
  - pytest
  - pip
  - pip:
      - numpy==1.26.4
      - matplotlib==3.10.9
      - mlflow==3.13.0
      - entmax==1.3
      - opencv-python-headless==4.10.0.84   # only eval/figures/; 4.14 (used locally) needs numpy>=2
